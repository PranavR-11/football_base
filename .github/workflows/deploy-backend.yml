name: Deploy Backend to IONOS VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'deploy/ionos/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # Test SSH connection
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "echo 'SSH connection successful'"

          # Create directory structure if needed
          ssh $SERVER_USER@$SERVER_HOST "mkdir -p $SERVER_PATH/deploy/ionos"

          # Write environment file remotely
          ssh $SERVER_USER@$SERVER_HOST "cat > $SERVER_PATH/deploy/ionos/.env << 'EOF'
          DOMAIN=${DOMAIN}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          MCP_API_KEY=${MCP_API_KEY}
          DATA_PATH=/app/data/FINAL_with_rag.csv
          VECTORSTORE_DIR=/app/data/vectorstore
          MODEL_PATH=/app/models/ridge_player_model.joblib
          AGENT_DEBUG=False
          EOF"

          # Run deployment script
          ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && bash deploy/ionos/deploy.sh"

      - name: Verify deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          # Check container status
          ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH/deploy/ionos && docker compose ps"

          # Show recent logs
          ssh $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH/deploy/ionos && docker compose logs --tail=20 api"

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully"
          echo "🔗 API should be available at: https://${{ secrets.DOMAIN }}"
          echo "🔍 Check logs with: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'cd ${{ secrets.SERVER_PATH }}/deploy/ionos && docker compose logs -f'"

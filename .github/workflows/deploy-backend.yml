name: Deploy Backend to IONOS VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'deploy/ionos/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    name: Deploy to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          # Verify key format
          echo "Key first line:"
          head -1 ~/.ssh/deploy_key
          echo "Key line count:"
          wc -l ~/.ssh/deploy_key

      - name: Deploy to VPS
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          # Test SSH connection
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "echo 'SSH connection successful'"

          # Pull latest code
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH && git fetch origin && git reset --hard origin/main"

          # Rebuild and restart containers
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH/deploy/ionos && docker compose down && docker compose build --no-cache api && docker compose up -d"

      - name: Verify deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          # Wait for services to start
          sleep 10

          # Check container status
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH/deploy/ionos && docker compose ps"

          # Show recent logs
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST "cd $SERVER_PATH/deploy/ionos && docker compose logs --tail=20 api"

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully"
          echo "🔗 API should be available at: https://${{ secrets.DOMAIN }}"
          echo "🔍 Check logs with: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'cd ${{ secrets.SERVER_PATH }}/deploy/ionos && docker compose logs -f'"
